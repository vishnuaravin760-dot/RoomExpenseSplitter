name: Build Room Expense Splitter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o "RoomExpenseSplitter_DELETE_NOTIFICATION_WITH_USER_V19.zip" -d extracted

      - name: Update Android project
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")
          APP_DIR="$PROJECT/app"
          SRC_DIR="$APP_DIR/src/main/java/com/example/roomexpensesplitter"

          mkdir -p "$SRC_DIR"

          cp MainActivity.kt "$SRC_DIR/MainActivity.kt"
          cp build.gradle.kts "$APP_DIR/build.gradle.kts"
          cp google-services.json "$APP_DIR/google-services.json"

          echo "Project: $PROJECT"
          echo "Source: $SRC_DIR"

      - name: Configure Gradle
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")

          sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.3" apply false' "$PROJECT/build.gradle.kts"

          sed -i '/android {/a\    buildFeatures {\n        compose = true\n    }' "$PROJECT/app/build.gradle.kts"

      - name: Debug project structure
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")
          echo "PROJECT=$PROJECT"
          ls -la "$PROJECT"
          find extracted -iname "gradlew*"
          - name: Generate Gradle wrapper
           run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")
          cd "$PROJECT"
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")

          cd "$PROJECT"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomExpenseSplitter-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
