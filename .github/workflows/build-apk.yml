name: Build Room Expense Splitter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract purple design project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="RoomExpense_Purple_Design_v21.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::RoomExpense_Purple_Design_v21.zip is missing. Upload it to the repository root."
            exit 1
          fi

          SOURCE_DIR=$(mktemp -d "$RUNNER_TEMP/roomexpense.XXXXXX")
          unzip -q "$ZIP" -d "$SOURCE_DIR"

          PROJECT_DIR="$SOURCE_DIR/RoomExpenseSplitter"
          CODE_DIR="$PROJECT_DIR/app/src/main/java/com/example/roomexpensesplitter"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Android project was not found inside the ZIP."
            exit 1
          fi

          if [ ! -f "$CODE_DIR/MainActivityLock.kt" ]; then
            echo "::error::Biometric lock file is missing."
            exit 1
          fi

          if [ ! -f "$CODE_DIR/BillAttachment.kt" ]; then
            echo "::error::Bill attachment file is missing."
            exit 1
          fi

          if [ ! -f "$CODE_DIR/SplitLogic.kt" ]; then
            echo "::error::Custom split file is missing."
            exit 1
          fi

          if [ ! -f "$CODE_DIR/RoomTheme.kt" ]; then
            echo "::error::Purple design file is missing. Upload the latest ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Purple design version 2.1 selected."

      - name: Enable Compose
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()

          if "buildFeatures" not in s:
              s = s.replace(
                  "android {\n",
                  "android {\n    buildFeatures {\n        compose = true\n    }\n",
                  1
              )

          p.write_text(s)
          print("Compose enabled.")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build new APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" testDebugUnitTest assembleDebug --stacktrace

      - name: Upload new APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomExpense-Purple-Design-v21-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
