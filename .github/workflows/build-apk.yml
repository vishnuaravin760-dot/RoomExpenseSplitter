name: Build Room Expense Splitter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and Extract Android project
        run: |
          echo "Looking for ZIP file..."

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          unzip -o "$ZIP"

          echo "Project extracted."

          find . -maxdepth 3 -type f | sort | head -200

      - name: Enable Compose
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("RoomExpenseSplitter/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              if "buildFeatures" not in s:
                  s = s.replace(
                      "android {\n",
                      """android {
              buildFeatures {
                  compose = true
              }

          """,
                      1
                  )

              p.write_text(s)
              print("Compose configuration updated.")
          else:
              print("build.gradle.kts not found.")
              exit(1)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p RoomExpenseSplitter assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomExpenseSplitter-APK
          path: RoomExpenseSplitter/app/build/outputs/apk/debug/app-debug.apk
