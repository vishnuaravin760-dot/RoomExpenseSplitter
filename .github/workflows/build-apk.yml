name: Build Room Expense Splitter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o "RoomExpenseSplitter_DELETE_NOTIFICATION_WITH_USER_V19.zip" -d extracted
          ls -la extracted

      - name: Find Android project
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")
          echo "Project: $PROJECT"
          find "$PROJECT" -maxdepth 2 -type f -name "*.gradle.kts"

      - name: Update Android project files
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")
          APP_DIR="$PROJECT/app"

          echo "Project: $PROJECT"
          echo "App directory: $APP_DIR"

          cp MainActivity.kt "$APP_DIR/MainActivity.kt"
          cp app/build.gradle.kts "$APP_DIR/build.gradle.kts"
          cp google-services.json "$APP_DIR/google-services.json"

          echo "Files copied successfully."

      - name: Configure Gradle
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")
          APP_GRADLE="$PROJECT/app/build.gradle.kts"
          ROOT_GRADLE="$PROJECT/build.gradle.kts"

          python3 - <<PY
          from pathlib import Path

          root = Path("$ROOT_GRADLE")
          app = Path("$APP_GRADLE")

          # Add Google Services plugin version to root Gradle
          if root.exists():
              s = root.read_text()

              if "com.google.gms.google-services" not in s:
                  if "plugins {" in s:
                      s = s.replace(
                          "plugins {",
                          'plugins {\\n    id("com.google.gms.google-services") version "4.4.3" apply false',
                          1
                      )
                  else:
                      s = 'plugins {\\n    id("com.google.gms.google-services") version "4.4.3" apply false\\n}\\n\\n' + s

                  root.write_text(s)

          # Enable Compose in app module
          if app.exists():
              s = app.read_text()

              if "buildFeatures" not in s:
                  marker = 'android {'
                  if marker in s:
                      s = s.replace(
                          marker,
                          'android {\\n    buildFeatures {\\n        compose = true\\n    }',
                          1
                      )

              app.write_text(s)

          print("Gradle configuration updated.")
          PY

          echo "ROOT GRADLE:"
          cat "$ROOT_GRADLE"

          echo "APP GRADLE:"
          cat "$APP_GRADLE"

      - name: Setup Gradle
        uses: gradle
