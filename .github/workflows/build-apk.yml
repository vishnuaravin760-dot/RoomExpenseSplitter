name: Build Room Expense Splitter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP"
      - name: Enable Compose
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("RoomExpenseSplitter/app/build.gradle.kts")
          s = p.read_text()
          if "buildFeatures" not in s:
              s = s.replace(
                  "android {\n",
                  "android {\n    buildFeatures {\n        compose = true\n    }\n\n",
                  1
              )
              p.write_text(s)
          PY
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p RoomExpenseSplitter assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomExpenseSplitter-APK
          path: RoomExpenseSplitter/app/build/outputs/apk/debug/app-debug.apk
