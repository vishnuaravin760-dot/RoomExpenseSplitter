name: Build Room Expense Splitter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore permanent signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ROOM_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Create the ROOM_DEBUG_KEYSTORE_BASE64 repository secret first."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY" |
            base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey > /dev/null

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="RoomExpense_Purple_Design_v21.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Upload RoomExpense_Purple_Design_v21.zip to the repository root."
            exit 1
          fi

          SOURCE_DIR=$(mktemp -d "$RUNNER_TEMP/roomexpense.XXXXXX")
          unzip -q "$ZIP" -d "$SOURCE_DIR"

          PROJECT_DIR="$SOURCE_DIR/RoomExpenseSplitter"
          CODE_DIR="$PROJECT_DIR/app/src/main/java/com/example/roomexpensesplitter"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Android project is missing."
            exit 1
          fi

          for FILE in MainActivityLock.kt BillAttachment.kt SplitLogic.kt RoomTheme.kt; do
            if [ ! -f "$CODE_DIR/$FILE" ]; then
              echo "::error::$FILE is missing. Upload the latest ZIP."
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable Compose
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()

          if "buildFeatures" not in s:
              s = s.replace(
                  "android {\n",
                  "android {\n    buildFeatures {\n        compose = true\n    }\n",
                  1
              )

          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomExpense-APK-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove runner signing key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.android/debug.keystore"
